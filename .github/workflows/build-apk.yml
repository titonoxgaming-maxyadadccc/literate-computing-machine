name: TITONOX APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TITONOX APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Accept ALL Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses

          # Run a second time to catch remaining licenses
          yes | sdkmanager --licenses

          echo "SDK license acceptance step completed."

      # Install ONLY what the Android build needs
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Find uploaded ZIP
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # Extract ZIP
      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o "${{ steps.zip.outputs.zip }}" \
            -d android-project

      # Find actual Gradle project
      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Install Gradle
      - name: Install Gradle
        shell: bash
        run: |
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          gradle --version

      # Debug signing
      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Build
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # Find APK
      - name: Locate APK
        shell: bash
        run: |
          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      # Prepare APK
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp "$APK" release/TITONOX-debug.apk

          ls -lh release/TITONOX-debug.apk

      # Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITONOX-APK
          path: release/TITONOX-debug.apk
          if-no-files-found: error
